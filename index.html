<html lang="en" class="sl-theme-dark">
    <head>
        <meta charset="UTF-8" />
        <title>Baal Capital</title>
        <meta name="description" content="Baal Capital" />
        <meta name="author" content="Baal Capital" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" type="image/png" href="favicon.png" />
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.css" />
        <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    </head>
    <style>
        body {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            margin: auto;
            max-width: 800px;
            overflow: scroll;
            height: 100%;
            font-family: 'Roboto', sans-serif;
            background-color: black;
            color: white;
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            margin: auto;
            height: 100%;
            width: 100%;
            z-index: -1;
            filter: blur(12px);
            -webkit-filter: blur(12px);
            opacity: 0.7;
            background-image: url("favicon.png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }
        .main {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        h1 {
            font-size: 60px;
        }
        h2 {
            font-size: 40px;
        }
        h3 {
            font-size: 30px;
        }
        h4 {
            font-size: 10px;
        }

        @media (width <= 700px) {
            body {
                max-width: 550px;
                font-size: 20px;
            }

            h1 {
                font-size: 30px;
            }
            h2 {
                font-size: 20px;
            }
            h3 {
                font-size: 15px;
            }
            h4 {
                font-size: 10px;
            }
        }

    </style>
    <body>
        <div class="main">
            <p></p>
            <img class="background" src="favicon.png" alt="Baal Capital" width="200" height="200"/>
            <div>
                <h1>Baal Capital</h1>
            </div>
            <h4>&copy; 2025 Baal Capital. All rights reserved.</h4>
        </div>
    </body>
</html>
