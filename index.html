<html lang="en" class="sl-theme-dark">
    <head>
        <meta charset="UTF-8" />
        <title>Baal Capital</title>
        <meta name="description" content="Baal Capital" />
        <meta name="author" content="Baal Capital" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" type="image/png" href="favicon.png" />
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    </head>
    <style>
        @font-face {
            font-family: "Font";
            src: url("Font.ttf") format("truetype");
        }
        body {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            margin: auto;
            max-width: 800px;
            overflow: hidden;
            height: 100%;
            font-family: 'Font', sans-serif;
            background-color: black;
            color: white;
        }
        @keyframes animate {
            from {
                opacity: 0.2;
            }
            to {
                opacity: 0.6;
            }
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            display: block;
            margin: auto;
            aspect-ratio: auto;
            min-height: 300px;
            min-width: 300px;
            height: auto;
            width: 100%;
            z-index: -1;
            filter: blur(12px);
            -webkit-filter: blur(12px);
            opacity: 0.7;
            animation-name: animate;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }
        .main {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        h1 {
            font-size: 60px;
        }
        h2 {
            font-size: 40px;
        }
        h3 {
            font-size: 30px;
        }
        h4 {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
        }

        @media (width <= 700px) {
            body {
                max-width: 550px;
                font-size: 20px;
            }
            h1 {
                font-size: 30px;
            }
            h2 {
                font-size: 20px;
            }
            h3 {
                font-size: 15px;
            }
            h4 {
                font-size: 10px;
            }
        }

    </style>
    <body>
        <div class="main">
            <p></p>
            <img class="background" src="favicon.png" alt="Baal Capital" width="200" height="200"/>
            <div>
                <h1>Baal Capital</h1>
            </div>
            <h4>&copy; 2025 Baal Capital. All rights reserved.</h4>
        </div>
    </body>
</html>
